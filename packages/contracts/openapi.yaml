  /ws:
    get:
      tags: [realtime]
      summary: "BARU v3.0 — WebSocket status kamera & alert"
      description: >-
        Endpoint WebSocket (bukan HTTP biasa). Klien menyambung dengan query
        ?token=<JWT access token>. Server mengirim event JSON:
        {"type":"camera.status","stream_id":1,"online":true},
        {"type":"recording.progress","stream_id":1,...},
        {"type":"alert","kind":"person","stream_id":2,...} (alert hanya bila modul AI on).
