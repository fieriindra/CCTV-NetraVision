      x-v3-status: new
      x-v3-module: ws.py
      parameters:
        - { name: token, in: query, required: true, schema: { type: string }, description: "JWT access token" }
      responses:
        "101":
          description: Upgrade ke WebSocket
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
