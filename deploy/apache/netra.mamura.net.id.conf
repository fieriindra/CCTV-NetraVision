# NetraVision v3.0 — Apache virtual host
# Dipasang oleh deploy/install.sh ke /etc/apache2/sites-available/netra.mamura.net.id.conf
#
# ATURAN KERAS: Apache tetap memegang port 80 & 443 untuk SEMUA virtualhost.
# File ini hanya mengatur vhost netra.mamura.net.id; vhost lain tidak disentuh.
# Sertifikat TLS dikelola certbot yang SUDAH ADA — jangan buat self-signed.
#
# Modul Apache yang dibutuhkan (diaktifkan install.sh):
#   proxy proxy_http proxy_wstunnel rewrite ssl headers

# Konvensi path yang diproxy (frontend Fase 2 memakai konvensi ini):
#   /api/*   -> FastAPI (http://127.0.0.1:8100)
#   /ws      -> WebSocket FastAPI (ws://127.0.0.1:8100)
#   /whep/*  -> sinyal WebRTC MediaMTX (http://127.0.0.1:8889/<path>/whep)
#   /hls/*   -> fallback HLS MediaMTX (http://127.0.0.1:8888/<path>/index.m3u8)
# Media WebRTC (UDP 8189) TIDAK lewat Apache — langsung ke MediaMTX.

<VirtualHost *:80>
    ServerName netra.mamura.net.id

    # ACME challenge harus bisa diakses via HTTP — kecualikan dari redirect.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    DocumentRoot /var/www/netravision/out
    <Directory /var/www/netravision/out>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/netravision_http_error.log
    CustomLog ${APACHE_LOG_DIR}/netravision_http_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName netra.mamura.net.id

    # --- TLS: sertifikat dari certbot yang sudah ada ---
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/netra.mamura.net.id/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/netra.mamura.net.id/privkey.pem

    # --- Frontend: Next.js static export ---
    DocumentRoot /var/www/netravision/out
    <Directory /var/www/netravision/out>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # --- Security headers dasar (pelajaran audit R8) ---
    # CATATAN: X-Frame-Options SENGAJA tidak dipasang — halaman /embed harus
    # bisa di-iframe oleh domain mitra (kontrak embed v2.0). Proteksi framing
    # diatur per API-key (domain lock) di aplikasi, Fase 3.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # --- Reverse proxy ke service Docker (semua hanya di 127.0.0.1) ---
    ProxyPreserveHost On
    ProxyRequests Off

    # mod_alias bawaan Debian memetakan /icons/ ke /usr/share/apache2/icons
    # (berlaku global) dan menimpa out/icons/ PWA -> icon.svg 404.
    Alias /icons/ /var/www/netravision/out/icons/

    # API FastAPI
    ProxyPass        /api/ http://127.0.0.1:8100/api/
    ProxyPassReverse /api/ http://127.0.0.1:8100/api/

    # WebSocket FastAPI (status kamera, alert) — butuh proxy_wstunnel
    ProxyPass        /ws ws://127.0.0.1:8100/ws
    ProxyPassReverse /ws ws://127.0.0.1:8100/ws

    # Sinyal WebRTC/WHEP MediaMTX
    ProxyPass        /whep/ http://127.0.0.1:8889/
    ProxyPassReverse /whep/ http://127.0.0.1:8889/

    # Fallback HLS MediaMTX
    ProxyPass        /hls/ http://127.0.0.1:8888/
    ProxyPassReverse /hls/ http://127.0.0.1:8888/
    # MediaMTX mengirim Location relatif ke root (/path/...) — kembalikan
    # awalan /hls/ agar redirect tidak lepas dari proxy.
    <Location /hls/>
        Header edit Location ^/(?!hls/) /hls/
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/netravision_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/netravision_ssl_access.log combined
</VirtualHost>
